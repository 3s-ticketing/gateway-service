plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.ticketing'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	springCloudVersion = "2025.0.1"
}

dependencies {
	// Gateway
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

	// Config Server
	implementation 'org.springframework.cloud:spring-cloud-starter-config'

	// Security + Keycloak JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()

	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'spring.config.import', 'optional:configserver:'
	systemProperty 'spring.cloud.config.enabled', 'false'
	systemProperty 'spring.cloud.config.fail-fast', 'false'
	systemProperty 'spring.cloud.config.import-check.enabled', 'false'
	systemProperty 'spring.cloud.bootstrap.enabled', 'false'
	systemProperty 'spring.cloud.discovery.enabled', 'false'
	systemProperty 'eureka.client.enabled', 'false'
}
