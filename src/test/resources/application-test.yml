spring:
  application:
    name: gateway-service

  cloud:
    config:
      enabled: false
      fail-fast: false
      import-check:
        enabled: false

    discovery:
      enabled: false

    gateway:
      server:
        webflux:
          routes: []

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false