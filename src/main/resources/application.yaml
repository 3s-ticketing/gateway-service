server:
  port: ${GATEWAY_PORT:10000}

spring:
  application:
    name: gateway-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:10002}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/ticketing}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/ticketing/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users,/api/users/**,/api/auth,/api/auth/**

            - id: club-service
              uri: lb://club-service
              predicates:
                - Path=/api/clubs,/api/clubs/**,/api/stadiums,/api/stadiums/**

            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/matches,/api/matches/**

            - id: seat-service
              uri: lb://seat-service
              predicates:
                - Path=/api/seats,/api/seats/**,/api/seat-grades,/api/seat-grades/**

            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/reservations,/api/reservations/**,/api/reservation-seats,/api/reservation-seats/**

            - id: queue-service
              uri: lb://queue-service
              predicates:
                - Path=/api/queues,/api/queues/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments,/api/payments/**

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:10001/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.ticketing.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus